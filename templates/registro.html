<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMART HSE | Crear cuenta</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { primary: '#006a9b', secondary: '#7ab038' } } } };
    </script>
    <style>
        .hero-photo {
            background-image: linear-gradient(rgba(0,30,55,0.6), rgba(0,30,55,0.7)),
                url("{{ url_for('static', filename='fondo_hero.jpg') }}");
            background-size: cover; background-position: center;
        }
    </style>
</head>
<body class="hero-photo min-h-screen flex items-center justify-center p-4 font-sans">
    <div class="w-full max-w-md bg-white rounded-2xl shadow-2xl p-8 my-6">
        <a href="/" class="flex justify-center mb-6">
            <img src="{{ url_for('static', filename='logo_smarthse.png') }}" alt="SMART HSE" class="h-20 w-auto">
        </a>
        <h1 class="text-2xl font-extrabold text-center text-gray-900 mb-1">Crear cuenta</h1>
        <p class="text-center text-sm text-gray-500 mb-6">Registro de Asesor en Prevención</p>

        {% if error %}
        <div class="mb-4 flex items-center gap-2 bg-red-50 border border-red-200 text-red-700 text-sm rounded-lg px-4 py-3">
            <i data-lucide="alert-circle" class="w-4 h-4 shrink-0"></i> <span>{{ error }}</span>
        </div>
        {% endif %}

        <form method="POST" action="/registro" class="space-y-4">
            <label class="block">
                <span class="text-sm font-semibold text-gray-700">Nombre completo</span>
                <input type="text" name="nombre" value="{{ nombre or '' }}" required placeholder="Nombre y apellidos"
                       class="mt-1 w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary outline-none">
            </label>
            <label class="block">
                <span class="text-sm font-semibold text-gray-700">RUT</span>
                <input type="text" name="rut" value="{{ rut or '' }}" required placeholder="12.345.678-9"
                       class="mt-1 w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary outline-none">
            </label>
            <label class="block">
                <span class="text-sm font-semibold text-gray-700">N° SNS (ID de usuario)</span>
                <input type="text" name="sns" value="{{ sns or '' }}" required placeholder="Ej: 12.345.678-K"
                       class="mt-1 w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary outline-none">
                <span class="text-xs text-gray-400">Número entregado por la SEREMI de Salud al registrarte como prevencionista.</span>
            </label>
            <label class="block">
                <span class="text-sm font-semibold text-gray-700">Rol</span>
                <select name="rol" class="mt-1 w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary outline-none">
                    <option value="asesor" {% if rol == 'asesor' %}selected{% endif %}>Asesor en Prevención</option>
                    <option value="empresa" {% if rol == 'empresa' %}selected{% endif %}>Empresa</option>
                </select>
            </label>
            <div class="grid grid-cols-2 gap-3">
                <label class="block">
                    <span class="text-sm font-semibold text-gray-700">Clave</span>
                    <input type="password" name="clave" required placeholder="Alfanumérica"
                           class="mt-1 w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary outline-none">
                </label>
                <label class="block">
                    <span class="text-sm font-semibold text-gray-700">Confirmar</span>
                    <input type="password" name="clave2" required placeholder="Repite la clave"
                           class="mt-1 w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary outline-none">
                </label>
            </div>
            <p class="text-xs text-gray-400 -mt-1">Mínimo 6 caracteres, con letras y números.</p>
            <button type="submit" class="w-full bg-secondary hover:bg-[#6a9e32] text-white py-3 rounded-lg font-bold transition flex items-center justify-center gap-2">
                <i data-lucide="user-plus" class="w-5 h-5"></i> Crear cuenta
            </button>
        </form>

        <p class="text-center text-sm text-gray-500 mt-6">
            ¿Ya tienes cuenta? <a href="/login" class="text-primary font-bold hover:underline">Ingresa aquí</a>
        </p>
    </div>
    <script>lucide.createIcons();</script>
</body>
</html>
