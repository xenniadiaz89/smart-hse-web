<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMART HSE | Gestión de documentos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { primary: '#006a9b', secondary: '#7ab038' } } } };
    </script>
    <style>
        .hero-photo {
            background-image: linear-gradient(rgba(0,30,55,0.6), rgba(0,30,55,0.7)),
                url("{{ url_for('static', filename='fondo_hero.jpg') }}");
            background-size: cover; background-position: center;
        }
        .gd-in { margin-top:.25rem; width:100%; padding:.75rem; border:1px solid #d1d5db; border-radius:.5rem; outline:none; }
        .gd-in:focus { border-color:#006a9b; box-shadow:0 0 0 2px rgba(0,106,155,.2); }
    </style>
</head>
<body class="hero-photo min-h-screen flex items-center justify-center p-4 font-sans">
    <div class="w-full max-w-lg bg-white rounded-2xl shadow-2xl p-8 my-6">
        <a href="/" class="flex justify-center mb-6">
            <img src="{{ url_for('static', filename='logo_smarthse.png') }}" alt="SMART HSE" class="h-16 w-auto">
        </a>

        <!-- Pregunta inicial -->
        <div id="pregunta" class="text-center">
            <div class="h-14 w-14 rounded-2xl bg-secondary/15 text-secondary flex items-center justify-center mx-auto mb-4">
                <i data-lucide="folder-cog" class="w-7 h-7"></i>
            </div>
            <h1 class="text-2xl font-extrabold text-gray-900 mb-2">¿Deseas gestionar documentos?</h1>
            <p class="text-sm text-gray-500 mb-6">Si gestionas documentación HSE de una empresa, registra sus datos para asociar tus flujos documentales (FYS, RESSO, matrices, etc.).</p>
            <div class="flex flex-col sm:flex-row gap-3 justify-center">
                <button type="button" onclick="mostrarForm()" class="inline-flex items-center justify-center gap-2 bg-secondary hover:bg-[#6a9e32] text-white px-6 py-3 rounded-lg font-bold transition">
                    <i data-lucide="check" class="w-5 h-5"></i> Sí, gestionar documentos
                </button>
                <form method="POST" action="/gestion-documentos">
                    <input type="hidden" name="accion" value="omitir">
                    <button type="submit" class="w-full inline-flex items-center justify-center gap-2 text-gray-500 border border-gray-300 px-6 py-3 rounded-lg font-bold hover:bg-gray-50 transition">
                        Ahora no
                    </button>
                </form>
            </div>
        </div>

        <!-- Formulario de empresa -->
        <div id="formEmpresa" class="hidden">
            <h1 class="text-2xl font-extrabold text-gray-900 mb-1 text-center">Datos de la empresa</h1>
            <p class="text-sm text-gray-500 mb-6 text-center">Empresa cuya documentación HSE vas a gestionar.</p>

            {% if error %}
            <div class="mb-4 flex items-center gap-2 bg-red-50 border border-red-200 text-red-700 text-sm rounded-lg px-4 py-3">
                <i data-lucide="alert-circle" class="w-4 h-4 shrink-0"></i> <span>{{ error }}</span>
            </div>
            {% endif %}

            <form method="POST" action="/gestion-documentos" class="space-y-4">
                <label class="block">
                    <span class="text-sm font-semibold text-gray-700">Nombre de la empresa</span>
                    <input type="text" name="empresa" value="{{ nombre or '' }}" required placeholder="Razón social" class="gd-in">
                </label>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <label class="block">
                        <span class="text-sm font-semibold text-gray-700">RUT de la empresa</span>
                        <input type="text" name="rut_empresa" value="{{ rut or '' }}" placeholder="76.123.456-7" class="gd-in">
                    </label>
                    <label class="block">
                        <span class="text-sm font-semibold text-gray-700">Rubro / Actividad económica</span>
                        <input type="text" name="rubro" value="{{ rubro or '' }}" placeholder="Ej: Servicios mineros" class="gd-in">
                    </label>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <label class="block">
                        <span class="text-sm font-semibold text-gray-700">Mandante / Cliente</span>
                        <select name="mandante" class="gd-in">
                            <option value="">-- Seleccione --</option>
                            <option value="Codelco DRT" {% if mandante == 'Codelco DRT' %}selected{% endif %}>Codelco DRT</option>
                            <option value="Minera Spence" {% if mandante == 'Minera Spence' %}selected{% endif %}>Minera Spence</option>
                            <option value="Minera El Abra" {% if mandante == 'Minera El Abra' %}selected{% endif %}>Minera El Abra</option>
                            <option value="Centinela" {% if mandante == 'Centinela' %}selected{% endif %}>Centinela</option>
                            <option value="Otro" {% if mandante == 'Otro' %}selected{% endif %}>Otro</option>
                        </select>
                    </label>
                    <label class="block">
                        <span class="text-sm font-semibold text-gray-700">Faena / Contrato</span>
                        <input type="text" name="faena" value="{{ faena or '' }}" placeholder="Ej: Radomiro Tomic / Contrato 405" class="gd-in">
                    </label>
                </div>
                <button type="submit" class="w-full bg-primary hover:bg-[#005580] text-white py-3 rounded-lg font-bold transition flex items-center justify-center gap-2">
                    <i data-lucide="save" class="w-5 h-5"></i> Guardar y entrar al panel
                </button>
            </form>
        </div>
    </div>
    <script>
        function mostrarForm() {
            document.getElementById('pregunta').classList.add('hidden');
            document.getElementById('formEmpresa').classList.remove('hidden');
        }
        // Si vuelve con error de validación, mostrar el formulario directamente
        {% if error %}mostrarForm();{% endif %}
        lucide.createIcons();
    </script>
</body>
</html>
