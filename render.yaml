databases:
  - name: smart-hse-db
    plan: free

services:
  - type: web
    name: smart-hse
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: smart-hse-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: RESEND_API_KEY
        sync: false   # se configura a mano en el dashboard de Render con la key real de Resend
      - key: RESEND_FROM
        sync: false   # opcional; remitente verificado en Resend. Sin definir, usa el sandbox de Resend.
